<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>WORLD LIFE v0.1</title><style>
html,body{margin:0;height:100%;background:#0e1218;color:#fff;font-family:Arial,sans-serif;overflow:hidden}#app{height:100%;position:relative}#hud{position:absolute;z-index:10;top:14px;right:14px;width:250px;background:rgba(13,18,26,.9);border:1px solid #394452;border-radius:14px;padding:14px;box-shadow:0 10px 30px #0008}.brand{font-size:22px;font-weight:800;margin-bottom:8px}.sub{font-size:12px;color:#9ca9b8}.stat{display:flex;justify-content:space-between;margin:8px 0;padding:8px;background:#19212c;border-radius:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}button{border:0;border-radius:9px;padding:9px;background:#273343;color:#fff;cursor:pointer}button:hover{background:#35465b}.hint{font-size:11px;color:#9ca9b8;margin-top:10px;line-height:1.5}#chat{position:absolute;z-index:10;bottom:14px;right:14px;width:310px;background:rgba(13,18,26,.9);border:1px solid #394452;border-radius:14px;padding:10px}#log{height:110px;overflow:auto;font-size:12px;line-height:1.55;margin-bottom:8px}.row{display:flex;gap:6px}.row input{flex:1;min-width:0;background:#111821;border:1px solid #33404e;color:#fff;border-radius:8px;padding:8px}canvas{display:block}
</style></head><body><div id="app"><div id="hud"><div class="brand">WORLD LIFE</div><div class="sub">القاهرة • Prototype v0.1</div><div class="stat"><span>الرصيد</span><b id="money">250 جنيه</b></div><div class="stat"><span>المهنة</span><b id="job">باحث عن عمل</b></div><div class="actions"><button id="work">💼 اعمل</button><button id="rent">🏪 استأجر محل</button></div><div class="hint">تحرك بالأسهم أو WASD. اقترب من المبنى الأزرق لتجربة أول تفاعل. افتح نافذتين لاختبار Multiplayer.</div></div><div id="chat"><div id="log"></div><div class="row"><input id="msg" placeholder="اكتب رسالة..." maxlength="120"><button id="send">إرسال</button></div></div></div><script type="module" src="/src/main.js"></script></body></html>
